# Keep the distribution allowlist in sync with deny.toml. The MPL exception is test-only.
accepted = ["MIT", "Apache-2.0", "Zlib", "ISC", "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0"]
ignore-dev-dependencies = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

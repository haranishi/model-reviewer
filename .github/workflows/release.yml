name: Distribution

"on":
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/**'
      - 'about.toml'
      - 'deny.toml'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'assets/samples/**'
      - 'LICENSE-*'
      - 'README*.md'
      - 'docs/build.md'
      - 'docs/download.md'
      - 'docs/release-notes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Check the version and license policy
        shell: python
        run: |
          from pathlib import Path
          import os, tomllib
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              if os.environ["GITHUB_REF"] != f"refs/tags/v{version}":
                  raise SystemExit(f"Expected tag v{version}")
              if not Path(f"docs/release-notes/v{version}.md").is_file():
                  raise SystemExit("Release notes missing for this tag")
          accepted = tomllib.loads(Path("about.toml").read_text())["accepted"]
          allowed = tomllib.loads(Path("deny.toml").read_text())["licenses"]["allow"]
          if set(accepted) != set(allowed):
              raise SystemExit("Distribution allowlist differs from deny.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              print(f"version={version}", file=out)
      - run: rustup toolchain install
      - run: cargo install --locked --version 0.9.3 --features cli cargo-about
      - name: Generate and check the third-party notices
        run: |
          mkdir -p target/notices
          file=target/notices/THIRD-PARTY-LICENSES
          cargo about generate --locked --fail --manifest-path crates/app/Cargo.toml \
            --config about.toml scripts/release/licenses.hbs --output-file "$file"
          python3 scripts/release/font_notices.py >> "$file"
          python3 scripts/release/font_notices.py --check "$file"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: target/notices/THIRD-PARTY-LICENSES
          if-no-files-found: error
          overwrite: true

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macos
            os: macos-15
            binary: target/model-reviewer-universal
          - system: windows
            os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/model-reviewer.exe
          - system: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/model-reviewer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: target/notices
      - name: Install Linux build and display packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers xvfb xauth fonts-noto-cjk
      - run: rustup toolchain install
      - name: Remap build paths and link the Windows C runtime
        shell: python
        run: |
          from pathlib import Path
          import os
          registry = Path(os.environ.get("CARGO_HOME", Path.home() / ".cargo")) / "registry" / "src"
          flags = [f"--remap-path-prefix={Path.cwd()}=.", f"--remap-path-prefix={registry}=crates.io"]
          if os.name == "nt":
              flags.extend(["-C", "target-feature=+crt-static"])
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              print("CARGO_ENCODED_RUSTFLAGS=" + chr(31).join(flags), file=out)
      - name: Build both macOS slices
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for arch in aarch64 x86_64; do
            cargo build --release --locked -p model-reviewer --target "$arch-apple-darwin"
          done
          lipo -create target/{aarch64,x86_64}-apple-darwin/release/model-reviewer -output target/model-reviewer-universal
          for arch in arm64 x86_64; do
            lipo target/model-reviewer-universal -verify_arch "$arch"
          done
      - name: Build x86-64
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p model-reviewer --target "${{ matrix.target }}"
      - name: Pack and verify the extracted download
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "scripts/release/package.py", "${{ matrix.system }}",
                          "${{ matrix.binary }}", "target/notices/THIRD-PARTY-LICENSES", "target/package",
                          "--keep-unpacked"], check=True)
      - name: Open the bundled sample on the hosted display
        id: smoke
        env:
          MODEL_REVIEWER_LOG: info
        run: |
          case "$RUNNER_OS" in
            Linux) WGPU_BACKEND=vulkan VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json \
                     xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/release/smoke.py ;;
            Windows) WGPU_BACKEND=dx12 python scripts/release/smoke.py ;;
            macOS) python3 scripts/release/smoke.py ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: "!cancelled() && steps.smoke.outcome != 'skipped'"
        with:
          name: smoke-${{ matrix.system }}
          path: target/package/smoke/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.system }}
          path: target/package/dist/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Check the three archives and write their checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          files=("model-reviewer-$VERSION-macos-universal.zip" "model-reviewer-$VERSION-windows-x86_64.zip"
                 "model-reviewer-$VERSION-linux-x86_64.tar.gz")
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Protect published releases on reruns
        env:
          TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $TOKEN")
          curl -fsS "${auth[@]}" "$api/git/ref/tags/$GITHUB_REF_NAME" -o /dev/null
          status=$(curl -sS "${auth[@]}" "$api/releases/tags/$GITHUB_REF_NAME" -o release.json -w '%{http_code}')
          case "$status" in
            200) jq -e '.draft == true' release.json ;;
            404) ;;
            *) echo "Release lookup failed (HTTP $status)"; exit 1 ;;
          esac
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/model-reviewer-${{ needs.prepare.outputs.version }}-macos-universal.zip
            dist/model-reviewer-${{ needs.prepare.outputs.version }}-windows-x86_64.zip
            dist/model-reviewer-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
            dist/SHA256SUMS
